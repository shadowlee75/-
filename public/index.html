<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="상품을 보고 장바구니에 담아 주문하는 쇼핑몰">
    <title>상품</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="https://js.tosspayments.com/v2/standard"></script>
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="text-link text-link--strong" href="/" data-link>상품</a>
        <nav class="site-header__nav" aria-label="회원 메뉴">
          <a class="text-link" href="/login" data-link data-auth-login>로그인</a>
          <a class="text-link" href="/signup" data-link data-auth-signup>회원가입</a>
          <a class="text-link" href="/mypage" data-link data-auth-mypage>마이페이지</a>
          <button class="text-link header-logout" type="button" data-auth-logout>로그아웃</button>
          <a class="outline-button outline-button--small" href="/cart" data-link>장바구니 <span class="cart-count" data-cart-count>0</span></a>
        </nav>
      </div>
    </header>
    <main id="app" class="page-shell" aria-live="polite"></main>
    <noscript>이 쇼핑몰을 이용하려면 JavaScript를 켜 주세요.</noscript>
  </body>
</html>
